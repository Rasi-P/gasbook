# REVIEW TEMPLATE ONLY. Applying a Blueprint can create and deploy a service.
# Do not apply until the personal workspace, billing, dedicated Neon target,
# approved Git SHA and separate deployment approval are recorded in the runbook.
# This is separate from render.yaml to preserve the earlier commercial proposal.
services:
  - type: web
    name: gasbook-demo-api
    runtime: python
    plan: free
    region: singapore
    rootDir: backend
    branch: main
    autoDeployTrigger: "off"
    buildCommand: python -m pip install --upgrade pip==26.2.0 && python -m pip install -r requirements.txt && python manage.py collectstatic --noinput
    startCommand: gunicorn gasbook.wsgi:application --bind 0.0.0.0:$PORT --workers 1 --threads 4 --access-logfile - --error-logfile -
    healthCheckPath: /ready/
    envVars:
      - key: GASBOOK_ENV
        value: production
      - key: PYTHON_VERSION
        value: 3.12.15
      - key: DEBUG
        value: "False"
      - key: DEMO_DISABLE_UPLOADS
        value: "True"
      - key: SECRET_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: ALLOWED_HOSTS
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: CSRF_TRUSTED_ORIGINS
        sync: false
      - key: ACCESSORIES_ENABLED
        value: "False"
    # No Render database, disk, Redis, paid preview or pre-deploy command.
    # Images use the existing frontend artwork/placeholders; uploads are rejected.
    # No MEDIA_ROOT is required while DEMO_DISABLE_UPLOADS=True. Do not enable
    # uploads on Render Free's ephemeral filesystem. No media service is needed.
