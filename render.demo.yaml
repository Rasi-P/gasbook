# REVIEW TEMPLATE ONLY. Applying a Blueprint can create and deploy a service.
# Do not apply until the personal workspace, billing, dedicated Neon target,
# approved Git SHA and separate deployment approval are recorded in the runbook.
# This is separate from render.yaml to preserve the earlier commercial proposal.
services:
  - type: web
    name: gasbook-demo-api
    runtime: docker
    plan: free
    region: singapore
    rootDir: backend
    branch: main
    autoDeployTrigger: "off"
    dockerfilePath: ./Dockerfile
    dockerContext: .
    dockerCommand: gunicorn gasbook.wsgi:application --bind 0.0.0.0:$PORT --workers 1 --threads 4 --access-logfile - --error-logfile -
    healthCheckPath: /ready/
    envVars:
      - key: GASBOOK_ENV
        value: production
      - key: DEBUG
        value: "False"
      - key: DEMO_DISABLE_UPLOADS
        value: "True"
      - key: SECRET_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: ALLOWED_HOSTS
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: CSRF_TRUSTED_ORIGINS
        sync: false
      - key: ACCESSORIES_ENABLED
        value: "True"
      - key: MEDIA_STORAGE_BACKEND
        value: imagekit
      - key: IMAGEKIT_PRIVATE_KEY
        sync: false
      - key: IMAGEKIT_URL_ENDPOINT
        sync: false
      - key: MEDIA_ENCRYPTION_KEY
        sync: false
    # No Render database, disk, Redis, paid preview or pre-deploy command.
    # Uploads stay disabled until personal ImageKit Free eligibility and credentials
    # are verified and activation is separately approved. Then set
    # DEMO_DISABLE_UPLOADS=False. No MEDIA_ROOT or local storage fallback.
    # Preserve the existing DEMO_DJANGO_ADMIN_ENABLED opt-in on the verified service.
    # This reference must not be applied to create a duplicate service: the Admin
    # guard permits only the existing approved service ID and Neon endpoint.
